    <!-- Fonts load without blocking first paint; display=swap shows fallback text meanwhile. -->

    <!-- Boot sequence: first visit per session only, never under reduced
         motion, pure CSS so it runs before the JS bundle. Any key or
         pointer press skips it. See DESIGN.md. -->
    <script>
      (function () {
        try {
          var d = document.documentElement
          if (sessionStorage.getItem("boot") || matchMedia("(prefers-reduced-motion: reduce)").matches) return
          sessionStorage.setItem("boot", "1")
          d.classList.add("boot")
          var done = false
          var end = function (skip) {
            if (done) return
            done = true
            if (skip) d.classList.add("boot-skip")
            setTimeout(function () { d.classList.remove("boot", "boot-skip") }, skip ? 260 : 0)
          }
          addEventListener("keydown", function () { end(true) }, { once: true })
          addEventListener("pointerdown", function () { end(true) }, { once: true })
          setTimeout(function () { end(false) }, 2150)
        } catch (e) {}
      })()
    </script>
    <style>
      #boot { display: none }
      html.boot { overflow: hidden }
      html.boot #boot {
        display: block; position: fixed; inset: 0; z-index: 100; background: #07090a; color: #ebe7dc;
        font: 500 11px/1.4 "Martian Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase;
        animation: boot-off .38s cubic-bezier(.65,0,.35,1) 1.75s forwards;
      }
      html.boot-skip #boot { animation: boot-off .24s cubic-bezier(.65,0,.35,1) forwards }
      #boot .grid {
        position: absolute; inset: 12vh 6vw; border: 1px solid rgba(255,176,0,.22);
        background-image: linear-gradient(rgba(255,176,0,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,176,0,.08) 1px, transparent 1px);
        background-size: 10% 12.5%; animation: boot-grid .5s cubic-bezier(.16,.9,.2,1) both;
      }
      #boot svg { position: absolute; inset: 12vh 6vw; width: 88vw; height: 76vh; overflow: visible }
      #boot path {
        fill: none; stroke: #ffb000; stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke;
        filter: drop-shadow(0 0 6px rgba(255,176,0,.7)); stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: boot-trace 1.05s cubic-bezier(.16,.9,.2,1) .3s forwards;
      }
      #boot .tl, #boot .br, #boot .bl { position: absolute; opacity: .75 }
      #boot .tl { top: calc(12vh - 26px); left: 6vw }
      #boot .bl { bottom: calc(12vh - 26px); left: 6vw }
      #boot .br { bottom: calc(12vh - 26px); right: 6vw; color: #ffb000; opacity: 1 }
      #boot .br::after { content: "acquiring"; animation: boot-lock 0s 1.3s forwards }
      #boot .n { counter-reset: n var(--n); animation: boot-count 1.3s steps(100) .1s forwards }
      #boot .n::after { content: counter(n, decimal-leading-zero) "%" }
      @property --n { syntax: "<integer>"; inherits: false; initial-value: 0 }
      @keyframes boot-count { to { --n: 100 } }
      @keyframes boot-grid { from { clip-path: inset(50% 50%); opacity: 0 } }
      @keyframes boot-trace { to { stroke-dashoffset: 0 } }
      @keyframes boot-lock { to { content: "signal locked" } }
      @keyframes boot-off {
        0% { transform: none; opacity: 1 }
        55% { transform: scale(1, .004); opacity: 1 }
        100% { transform: scale(0, .004); opacity: 0; visibility: hidden }
      }
    </style>
